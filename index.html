<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나랑 오목 한판</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4eee5,#14110e);--panel:light-dark(#fffaf3,#211b17);--text:light-dark(#241c16,#f8efe6);--muted:light-dark(#76695c,#b9aa9b);--line:light-dark(#dfd1be,#493b30);--wood:#d9aa60;--grid:#6d4b2a;--accent:light-dark(#a45e26,#e39a50)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background-color:var(--bg);padding:24px 14px 36px;border-radius:0}.wrap{max-width:960px;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.tag{font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--accent)}h1{font-size:clamp(30px,5vw,48px);line-height:1;margin:7px 0 0} .sub{margin:9px 0 0;color:var(--muted);font-size:14px}.new{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 40px rgba(50,30,10,.1)}.board-card{padding:clamp(10px,2.5vw,22px)}.board-wrap{width:min(100%,700px);aspect-ratio:1;margin:auto;background:var(--wood);padding:3.2%;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(50,30,10,.18),0 14px 30px rgba(50,30,10,.14)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}.side{padding:18px}.turn{background:light-dark(#f5ead9,#2a211b);border-radius:15px;padding:15px;margin-bottom:12px}.small{font-size:11px;color:var(--muted);font-weight:800}.who{font-size:22px;font-weight:950;margin-top:5px}.stone-dot{display:inline-block;width:15px;height:15px;border-radius:50%;margin-right:7px;vertical-align:-1px}.b{background:#111;box-shadow:inset -2px -2px 3px #000}.w{background:#f5f2eb;border:1px solid #aaa}.msg{color:var(--muted);font-size:13px;line-height:1.65;min-height:66px}.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.score div{border:1px solid var(--line);border-radius:11px;text-align:center;padding:9px;color:var(--muted);font-size:11px}.score b{display:block;font-size:20px;color:var(--text);margin-top:2px}.hint{border-top:1px solid var(--line);margin-top:15px;padding-top:14px;font-size:12px;color:var(--muted);line-height:1.7}.thinking{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.turn{margin:0}.msg{min-height:0}.hint{grid-column:1/-1;margin-top:0}.head{align-items:start}}
@media(max-width:430px){.side{grid-template-columns:1fr}.hint{grid-column:auto}.new{padding:9px 12px}}
</style>
</head>
<body>
<div id="app"><div class="wrap">
<header class="head"><div><div class="tag">CHATGPT OMOK</div><h1>나랑 오목 한판</h1><p class="sub">당신이 흑돌. 나는 백돌. 먼저 두세요.</p></div><button class="new" id="newGame">새 대국</button></header>
<div class="layout"><section class="card board-card"><div class="board-wrap"><canvas id="board" aria-label="15 x 15 오목판"></canvas></div></section>
<aside class="card side"><div class="turn"><div class="small">현재 차례</div><div class="who" id="who"><span class="stone-dot b"></span>당신</div></div><div class="msg" id="msg">좋아요. 첫 돌을 놓아주세요. 제가 바로 한 수 둘게요.</div><div class="score"><div>당신<b id="you">0</b></div><div>나<b id="me">0</b></div></div><div class="hint">가로·세로·대각선으로 5개를 연결하면 승리합니다.<br>돌을 놓은 뒤 제가 잠깐 생각하고 응수합니다.</div></aside></div>
</div></div>
<script>
const N=15,canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),who=document.getElementById('who'),msg=document.getElementById('msg'),newGame=document.getElementById('newGame'),youEl=document.getElementById('you'),meEl=document.getElementById('me');
let board,over=false,thinking=false,pad=0,cell=0,you=0,me=0;
function reset(){board=Array.from({length:N},()=>Array(N).fill(0));over=false;thinking=false;who.innerHTML='<span class="stone-dot b"></span>당신';msg.textContent='좋아요. 첫 돌을 놓아주세요. 제가 바로 한 수 둘게요.';draw()}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=r.width;canvas.width=w*d;canvas.height=w*d;ctx.setTransform(d,0,0,d,0,0);pad=w*.055;cell=(w-pad*2)/(N-1);draw()}
function draw(){const w=canvas.clientWidth;ctx.clearRect(0,0,w,w);ctx.strokeStyle='#6d4b2a';ctx.lineWidth=1;for(let i=0;i<N;i++){const p=pad+i*cell;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(w-pad,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,w-pad);ctx.stroke()}for(const x of [3,7,11])for(const y of [3,7,11]){ctx.fillStyle='#6d4b2a';ctx.beginPath();ctx.arc(pad+x*cell,pad+y*cell,3,0,Math.PI*2);ctx.fill()}for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(board[y][x])stone(x,y,board[y][x])}
function stone(x,y,c){const px=pad+x*cell,py=pad+y*cell,r=cell*.42,g=ctx.createRadialGradient(px-r*.3,py-r*.35,r*.05,px,py,r);if(c===1){g.addColorStop(0,'#555');g.addColorStop(.3,'#242424');g.addColorStop(1,'#050505')}else{g.addColorStop(0,'#fff');g.addColorStop(.75,'#eeeae2');g.addColorStop(1,'#aaa39a')}ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=c===1?'#000':'#999';ctx.lineWidth=.7;ctx.stroke()}
function won(x,y,c){for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(const s of [-1,1]){let xx=x+dx*s,yy=y+dy*s;while(xx>=0&&xx<N&&yy>=0&&yy<N&&board[yy][xx]===c){n++;xx+=dx*s;yy+=dy*s}}if(n>=5)return true}return false}
function scoreAt(x,y,c){let total=0;for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1,open=0;for(const s of [-1,1]){let xx=x+dx*s,yy=y+dy*s;while(xx>=0&&xx<N&&yy>=0&&yy<N&&board[yy][xx]===c){n++;xx+=dx*s;yy+=dy*s}if(xx>=0&&xx<N&&yy>=0&&yy<N&&board[yy][xx]===0)open++}if(n>=5)total+=100000;if(n===4)total+=open===2?9000:1500;if(n===3)total+=open===2?1000:120;if(n===2)total+=open===2?120:20}return total}
function aiMove(){thinking=true;who.innerHTML='<span class="stone-dot w"></span><span class="thinking">나, 생각 중…</span>';msg.textContent='어디에 둘지 보고 있어요.';setTimeout(()=>{let best=[],high=-1;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!board[y][x]){board[y][x]=2;const attack=scoreAt(x,y,2);board[y][x]=0;board[y][x]=1;const block=scoreAt(x,y,1);board[y][x]=0;let near=0;for(let yy=Math.max(0,y-2);yy<=Math.min(N-1,y+2);yy++)for(let xx=Math.max(0,x-2);xx<=Math.min(N-1,x+2);xx++)if(board[yy][xx])near++;const center=14-Math.abs(x-7)-Math.abs(y-7);const s=attack+block*.99+near*5+center*4;if(s>high){high=s;best=[{x,y}]}else if(s===high)best.push({x,y})}if(!best.length){over=true;msg.textContent='판이 꽉 찼네요. 무승부입니다!';return}const p=best[Math.floor(Math.random()*best.length)];board[p.y][p.x]=2;draw();thinking=false;if(won(p.x,p.y,2)){over=true;me++;meEl.textContent=me;who.innerHTML='<span class="stone-dot w"></span>나';msg.textContent='이번엔 내가 이겼네요. 다시 한 판 하시죠!';return}who.innerHTML='<span class="stone-dot b"></span>당신';msg.textContent='당신 차례입니다. 다음 수를 놓아주세요.'},420)}
function play(e){e.preventDefault();if(over||thinking)return;const r=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(N-1,Math.round((e.clientX-r.left-pad)/cell))),y=Math.max(0,Math.min(N-1,Math.round((e.clientY-r.top-pad)/cell)));if(board[y][x])return;board[y][x]=1;draw();if(won(x,y,1)){over=true;you++;youEl.textContent=you;who.innerHTML='<span class="stone-dot b"></span>당신';msg.textContent='당신이 이겼습니다! 내가 졌어요. 한 판 더?';return}aiMove()}
canvas.addEventListener('pointerdown',play);newGame.addEventListener('click',reset);window.addEventListener('resize',resize);reset();resize();
</script>
</body>
</html>
